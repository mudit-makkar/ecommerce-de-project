version: 2

sources:
  - name: ecommerce
    description: "Olist Brazilian E-Commerce raw data"
    database: ECOMMERCE_{{ target.name | upper }}
    schema: RAW

    # freshness checks — alert if data is stale
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    

    tables:
      - name: orders
        description: "One row per order. Core table of the dataset."
        columns:
          - name: order_id
            description: "Unique order identifier"
            tests:
              - unique
              - not_null
          - name: customer_id
            tests:
              - not_null
          - name: order_status
            tests:
              - not_null
              - accepted_values:
                  values: ['delivered','shipped','canceled','unavailable',
                           'invoiced','processing','created','approved']
      
      - name: order_items
        description: "One row per item within an order"
        columns:
          - name: order_id
            tests:
              - not_null
          - name: product_id
            tests:
              - not_null
          - name: price
            tests:
              - not_null

      - name: customers
        columns:
          - name: customer_id
            tests:
              - unique
              - not_null

      - name: products
        columns:
          - name: product_id
            tests:
              - unique
              - not_null
      
      - name: sellers
        columns:
          - name: seller_id
            tests:
              - unique
              - not_null

      - name: order_payments
        columns:
          - name: order_id
            tests:
              - not_null

      - name: order_reviews
        columns:
          - name: review_id
            tests:
              - not_null

      - name: geolocation
        description: "Zip code to lat/lng mapping. Has duplicates by design."

      - name: product_category_name_translation
        columns:
          - name: product_category_name
            tests:
              - unique
              - not_null
