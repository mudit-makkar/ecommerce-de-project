version: 2

models:
  - name: int_orders_enriched
    description: "One row per order with aggregated items, payments, and review data."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: int_order_items_enriched
    description: "One row per order item enriched with product and seller details."
    columns:
      - name: order_item_sk
        tests:
          - unique
          - not_null

  - name: int_customers_enriched
    description: "One row per customer with lifetime order statistics."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null