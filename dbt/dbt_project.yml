name: 'ecommerce_dbt'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_dbt'

# folder structure
model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# ── model configurations ──────────────────────────────────────
# this is where we tell dbt WHERE to write each layer
# and HOW to materialize them

models:
  ecommerce_dbt:

    staging:
      +materialized: view          # staging = views (no storage cost)
      +schema: STAGING             # writes to STAGING schema
      +tags: ['staging']

    intermediate:
      +materialized: view          # intermediate = views too
      +schema: INTERMEDIATE
      +tags: ['intermediate']

    marts:
      +materialized: table         # marts = actual tables (fast queries)
      +schema: MARTS
      +tags: ['marts']
      
      core:
        +materialized: table
      
      metrics:
        +materialized: table

# ── snapshot configurations ───────────────────────────────────
snapshots:
  ecommerce_dbt:
    +target_schema: SNAPSHOTS
    +strategy: timestamp
    +updated_at: _loaded_at
